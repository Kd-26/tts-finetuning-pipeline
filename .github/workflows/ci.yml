name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install PyYAML==6.0.2 soundfile==0.13.1 pytest==8.3.4 ruff==0.9.6
      - run: pip install -e . --no-deps
      - run: ruff check src tests scripts
      - run: pytest
